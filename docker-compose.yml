name: dev-spotify-player
services:
  player:
    build: .
    image: dev-spotify-player:latest
    container_name: dev-spotify-player
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3210
      APP_ORIGIN: https://dev-spotify.carubra.com
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3211:3210"
    volumes:
      - dev-player-data:/app/data
    networks:
      - default
      - carubra-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  dev-player-data:

networks:
  carubra-network:
    external: true
